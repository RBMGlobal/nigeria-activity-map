name: Sync company heat after events

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch company heat sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            repos/RBMGlobal/RBMGlobal.github.io/actions/workflows/maintain-public-sites.yml/dispatches \
            -f ref=main \
            -f inputs[mode]=maintenance
